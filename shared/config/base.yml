# Base Configuration for Gen-E2 Singapore Health Analysis Project
# This file contains shared settings used across all problem statements

project:
  name: "gen-e2-health-analysis"
  description: "Singapore Health Trends Analysis for Policy Decision-Making"
  version: "1.0.0"
  start_date: "2026-03-11"

stakeholders:
  primary:
    - "Policy Makers"
    - "Government Health Officials"
    - "Team Heads"
  
data:
  # Data source directories
  raw_data_path: "shared/data/1_raw/"
  external_data_path: "shared/data/2_external/"
  interim_data_path: "shared/data/3_interim/"
  processed_data_path: "shared/data/4_processed/"
  
  # Data quality settings
  quality_checks:
    enabled: true
    null_threshold: 0.05  # Maximum acceptable null percentage
    duplicate_check: true
    outlier_detection: true
  
  # File formats
  preferred_format: "parquet"  # parquet, csv, feather
  compression: "snappy"
  
  # Target diseases (can be overridden in problem-specific configs)
  target_diseases:
    - "Dengue Fever"
    - "Hand, Foot and Mouth Disease"
    - "Acute Upper Respiratory Tract Infections"
    - "Influenza"
    - "COVID-19"

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} - {message}"
  
  # Log file paths
  paths:
    etl: "logs/etl/"
    errors: "logs/errors/"
    audit: "logs/audit/"
  
  # Rotation settings
  rotation: "100 MB"
  retention: "30 days"

analysis:
  # Date range for analysis
  date_range:
    start_year: 2012
    end_year: 2026
  
  # Statistical settings
  confidence_level: 0.95
  significance_level: 0.05
  
  # Time series settings
  frequency: "W"  # W=Weekly, M=Monthly, D=Daily
  seasonal_periods: 52  # For weekly data (52 weeks/year)

visualization:
  # Default settings for all visualizations
  style: "seaborn-v0_8"
  figure_size: [12, 6]
  dpi: 300
  color_palette: "husl"
  
  # Export settings
  export_formats: ["png", "pdf"]
  export_path: "reports/figures/"

performance:
  # Memory and computation settings
  use_lazy_loading: true
  chunk_size: 10000
  n_jobs: -1  # -1 means use all available cores
  
  # Polars settings
  polars:
    streaming: true
    eager_execution: false

validation:
  # Schema validation
  enforce_schema: true
  strict_mode: false
  
  # Data type preferences
  preferred_dtypes:
    date: "Date"
    disease: "Categorical"
    count: "Int32"
    rate: "Float32"
