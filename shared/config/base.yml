project:
  name: gen-e2-workforce-analysis
  description: Workforce trend extraction and five-year forecasting scaffold
  stakeholder: team lead
  primary_decision: historical workforce trend interpretation
  success_metric: useful five-year forecast baseline

platform:
  mode: hybrid-local-first
  preferred_cloud: HEALIX/Databricks
  fallback_on_prem: MCDR/CDSW
  python_version: "3.9"

paths:
  raw_data: shared/data/1_raw
  external_data: shared/data/2_external
  schema_notes: shared/data/schemas
  artifacts_root: artifacts
  logs_root: logs

logging:
  level: INFO
  rotation: 10 MB
  retention: 30 days
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"

workforce:
  professions:
    - doctors
    - nurses
    - pharmacists
    - physiotherapists
  raw_folder: /sites/DataDojo/Shared Documents/Gen-e2/data-analysis/workforce
  local_raw_subdir: workforce
