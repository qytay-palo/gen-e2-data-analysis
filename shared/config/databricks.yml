# Databricks / HEALIX Platform Configuration

databricks:
  runtime: "13.3.x-scala2.12"
  python_version: "3.9"
  workspace_path: "/Workspace/Users/moh-analytics/"
  dbfs_mount: "/dbfs/mnt/moh-data/"
  cluster:
    spark_conf:
      spark.sql.adaptive.enabled: "true"
      spark.sql.adaptive.coalescePartitions.enabled: "true"
    node_type: Standard_DS3_v2
    autoscale:
      min_workers: 1
      max_workers: 4

storage:
  raw_data_path: "/dbfs/mnt/moh-data/1_raw/"
  processed_data_path: "/dbfs/mnt/moh-data/4_processed/"
  model_artifacts_path: "/dbfs/mnt/moh-data/models/"
